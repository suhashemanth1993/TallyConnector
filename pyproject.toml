[project]
name = "tally-connector"
version = "0.1.0"
description = "Windows connector synchronizing TallyPrime data with a cloud-hosted Frappe ERP over HTTP/XML and REST."
requires-python = ">=3.8"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "requests-mock>=1.12,<2",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: current mypy refuses to check against anything below
# 3.10. The actual runtime requirement (see requires-python above) is 3.8,
# for Windows 7 — verified separately by running the real test suite under
# Python 3.9 + eval_type_backport (the closest available proxy for 3.8's
# lack of PEP 604/585 support), not by mypy.
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
