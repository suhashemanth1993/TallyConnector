# Maps each Tally entity (see models/registry.py) to a target Frappe DocType
# and a field_map of {tally_field: frappe_field}. DocType names here are
# placeholders — rename them once your real Frappe DocTypes exist. Keys on
# the left of field_map are the snake_case attribute names on TallyMaster /
# TallyVoucher (models/masters.py, models/vouchers.py); values are the
# field names on the target Frappe DocType.

company:
  frappe_doctype: "Tally Company"
  field_map:
    guid: tally_guid
    name: title
    alter_id: tally_alter_id
    state_name: state
    gst_registration_number: gstin

group:
  frappe_doctype: "Tally Group"
  field_map:
    guid: tally_guid
    name: title
    parent: parent_group
    alter_id: tally_alter_id

ledger:
  frappe_doctype: "Tally Ledger"
  field_map:
    guid: tally_guid
    name: title
    parent: ledger_group
    alter_id: tally_alter_id
    opening_balance: opening_balance
    gstin: gstin
    ledger_contact: contact_person

voucher_type:
  frappe_doctype: "Tally Voucher Type"
  field_map:
